<div class="max-w-7xl mx-auto p-6">

  <!-- العنوان -->
  <div class="page-title flex items-center gap-3 mb-8">
    <span class="w-1.5 h-8 bg-indigo-600 rounded-full"></span>
    <h1 class="text-3xl font-bold text-gray-800">{{ 'Product.SORTING' | translate }}</h1>
  </div>

  <div class="flex flex-col md:flex-row gap-8 w-full">

    <!-- المنيو (الفلترة) -->
    <app-categorys
      (categorySelected)="handleCategory($event)"
      (sortChanged)="handleSort($event)"
      (searchChanged)="handleSearch($event)">
    </app-categorys>

    <!-- عرض المنتجات -->
    <div class="flex-1 w-full">
      <app-product-list [products]="products()" [total]="totalCount()"></app-product-list>

      <!-- Pagination -->
      @if (totalPages() > 1) {
        <nav class="pager flex flex-wrap justify-center items-center gap-2 mt-10" aria-label="Pagination">

          <!-- السابق -->
          <button
            type="button"
            (click)="goToPage(pageNumber() - 1)"
            [disabled]="pageNumber() === 1"
            aria-label="Previous page"
            class="pager-btn group h-10 w-10 grid place-items-center rounded-xl border border-gray-200 bg-white text-gray-600
                   transition-all duration-200
                   hover:-translate-y-0.5 hover:border-indigo-300 hover:bg-indigo-50 hover:text-indigo-600 hover:shadow-md
                   active:translate-y-0 active:scale-95
                   focus:outline-none focus-visible:ring-4 focus-visible:ring-indigo-100
                   disabled:opacity-40 disabled:cursor-not-allowed disabled:pointer-events-none">
            <svg class="w-4 h-4 transition-transform duration-200 rotate-180 rtl:rotate-0 group-hover:-translate-x-0.5 rtl:group-hover:translate-x-0.5"
                 viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M8 5l5 5-5 5" />
            </svg>
          </button>

          <!-- الصفحة الأولى -->
          @if (pages()[0] > 1) {
            <button type="button" (click)="goToPage(1)"
              class="pager-btn h-10 min-w-10 px-3 rounded-xl border border-gray-200 bg-white text-sm font-medium text-gray-700
                     transition-all duration-200 hover:-translate-y-0.5 hover:border-indigo-300 hover:bg-indigo-50 hover:text-indigo-600 hover:shadow-md
                     active:translate-y-0 active:scale-95 focus:outline-none focus-visible:ring-4 focus-visible:ring-indigo-100">
              1
            </button>
            @if (pages()[0] > 2) { <span class="px-1 text-gray-400 select-none">…</span> }
          }

          <!-- أرقام الصفحات -->
          @for (p of pages(); track p) {
            <button
              type="button"
              (click)="goToPage(p)"
              [attr.aria-current]="p === pageNumber() ? 'page' : null"
              class="pager-btn h-10 min-w-10 px-3 rounded-xl border text-sm transition-all duration-200
                     active:scale-95 focus:outline-none focus-visible:ring-4 focus-visible:ring-indigo-100"
              [class]="p === pageNumber()
                ? 'border-indigo-600 bg-indigo-600 text-white font-semibold shadow-lg shadow-indigo-200 scale-105'
                : 'border-gray-200 bg-white text-gray-700 font-medium hover:-translate-y-0.5 hover:border-indigo-300 hover:bg-indigo-50 hover:text-indigo-600 hover:shadow-md'">
              {{ p }}
            </button>
          }

          <!-- الصفحة الأخيرة -->
          @if (pages()[pages().length - 1] < totalPages()) {
            @if (pages()[pages().length - 1] < totalPages() - 1) { <span class="px-1 text-gray-400 select-none">…</span> }
            <button type="button" (click)="goToPage(totalPages())"
              class="pager-btn h-10 min-w-10 px-3 rounded-xl border border-gray-200 bg-white text-sm font-medium text-gray-700
                     transition-all duration-200 hover:-translate-y-0.5 hover:border-indigo-300 hover:bg-indigo-50 hover:text-indigo-600 hover:shadow-md
                     active:translate-y-0 active:scale-95 focus:outline-none focus-visible:ring-4 focus-visible:ring-indigo-100">
              {{ totalPages() }}
            </button>
          }

          <!-- التالي -->
          <button
            type="button"
            (click)="goToPage(pageNumber() + 1)"
            [disabled]="pageNumber() === totalPages()"
            aria-label="Next page"
            class="pager-btn group h-10 w-10 grid place-items-center rounded-xl border border-gray-200 bg-white text-gray-600
                   transition-all duration-200
                   hover:-translate-y-0.5 hover:border-indigo-300 hover:bg-indigo-50 hover:text-indigo-600 hover:shadow-md
                   active:translate-y-0 active:scale-95
                   focus:outline-none focus-visible:ring-4 focus-visible:ring-indigo-100
                   disabled:opacity-40 disabled:cursor-not-allowed disabled:pointer-events-none">
            <svg class="w-4 h-4 transition-transform duration-200 rtl:rotate-180 group-hover:translate-x-0.5 rtl:group-hover:-translate-x-0.5"
                 viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M8 5l5 5-5 5" />
            </svg>
          </button>

        </nav>
      }
    </div>

  </div>
</div>
