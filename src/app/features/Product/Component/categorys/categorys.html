<aside class="w-full md:w-64 flex-shrink-0 space-y-6">

  <!-- Sorting -->
  <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm transition-shadow duration-300 hover:shadow-md">
    <h3 class="font-bold text-gray-800 mb-3 text-lg">{{ 'Product.SORTING' | translate }}</h3>

    <div class="relative">
     <select
  (change)="onSortChange($event)"
  class="w-full appearance-none bg-white border border-gray-300 rounded-xl py-2.5 ps-3 pe-10 text-sm text-gray-700 cursor-pointer
         transition-all duration-200 hover:border-indigo-300
         focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100">
  <option value="price">{{ 'Product.PRICE_LOW_HIGH' | translate }}</option>
  <option value="price_desc">{{ 'Product.PRICE_HIGH_LOW' | translate }}</option>
  <option value="newest">{{ 'Product.NEWEST' | translate }}</option>
</select>

      <!-- سهم مخصص -->
      <svg class="pointer-events-none absolute end-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"
           viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 8l5 5 5-5" />
      </svg>
    </div>
  </div>

  <!-- Categories -->
  <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm transition-shadow duration-300 hover:shadow-md">
    <div class="flex items-center gap-2 mb-4">
      <span class="w-1 h-5 bg-indigo-600 rounded-full"></span>
      <h3 class="font-bold text-gray-800 text-lg">{{ 'Product.CATEGORIES' | translate }}</h3>
    </div>

    <ul class="space-y-1 text-sm">

      <!-- الكل -->
      <li class="cat-item" style="animation-delay: 0ms">
        <button
          type="button"
          (click)="onCategorySelect(null)"
          [attr.aria-pressed]="selectedCategoryId() === null"
          class="group relative w-full flex items-center justify-between overflow-hidden rounded-xl ps-4 pe-3 py-2.5 text-start
                 transition-all duration-200 active:scale-[0.98]
                 focus:outline-none focus-visible:ring-4 focus-visible:ring-indigo-100"
          [class]="selectedCategoryId() === null
            ? 'bg-indigo-50 text-indigo-600 font-bold'
            : 'text-gray-600 font-bold hover:bg-indigo-50 hover:text-indigo-600'">

          <!-- المؤشر الجانبي -->
          <span class="absolute start-0 top-1/2 -translate-y-1/2 w-1 rounded-full bg-indigo-600 transition-all duration-300"
                [class]="selectedCategoryId() === null ? 'h-6 opacity-100' : 'h-0 opacity-0 group-hover:h-4 group-hover:opacity-60'"></span>

          <span>{{ 'Product.ALL' | translate }}</span>

          <svg class="w-4 h-4 transition-all duration-200 rtl:rotate-180"
               [class]="selectedCategoryId() === null
                 ? 'opacity-100'
                 : 'opacity-0 ltr:-translate-x-1 rtl:translate-x-1 group-hover:opacity-100 group-hover:ltr:translate-x-0 group-hover:rtl:translate-x-0'"
               viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 5l5 5-5 5" />
          </svg>
        </button>
      </li>

      @for (cat of categories(); track cat.id) {
        <li class="cat-item" [style.animation-delay.ms]="($index + 1) * 50">
          <button
            type="button"
            (click)="onCategorySelect(cat.id)"
            [attr.aria-pressed]="selectedCategoryId() === cat.id"
            class="group relative w-full flex items-center justify-between overflow-hidden rounded-xl ps-4 pe-3 py-2.5 text-start
                   transition-all duration-200 active:scale-[0.98]
                   focus:outline-none focus-visible:ring-4 focus-visible:ring-indigo-100"
            [class]="selectedCategoryId() === cat.id
              ? 'bg-indigo-50 text-indigo-600 font-semibold'
              : 'text-gray-600 font-medium hover:bg-indigo-50 hover:text-indigo-600'">

            <span class="absolute start-0 top-1/2 -translate-y-1/2 w-1 rounded-full bg-indigo-600 transition-all duration-300"
                  [class]="selectedCategoryId() === cat.id ? 'h-6 opacity-100' : 'h-0 opacity-0 group-hover:h-4 group-hover:opacity-60'"></span>

            <span class="truncate">{{ cat.name }}</span>

            <svg class="w-4 h-4 flex-shrink-0 transition-all duration-200 rtl:rotate-180"
                 [class]="selectedCategoryId() === cat.id
                   ? 'opacity-100'
                   : 'opacity-0 ltr:-translate-x-1 rtl:translate-x-1 group-hover:opacity-100 group-hover:ltr:translate-x-0 group-hover:rtl:translate-x-0'"
                 viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M8 5l5 5-5 5" />
            </svg>
          </button>
        </li>
      } @empty {
        <li class="text-gray-400 text-center py-2 text-sm">No categories found</li>
      }

    </ul>
  </div>

  <!-- Search -->
  <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm transition-shadow duration-300 hover:shadow-md">
    <div class="group relative">

      <!-- أيقونة البحث -->
      <svg class="pointer-events-none absolute start-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400 transition-colors duration-200 group-focus-within:text-indigo-600"
           viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="9" cy="9" r="6" />
        <path d="M14 14l3.5 3.5" />
      </svg>

      <input
        type="text"
        [formControl]="searchControl"
        [placeholder]="'Product.SEARCH_PLACEHOLDER' | translate"
        class="w-full bg-white border border-gray-300 rounded-xl py-2.5 ps-10 pe-9 text-sm text-gray-700 placeholder-gray-400
               transition-all duration-200 hover:border-indigo-300
               focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100">

      <!-- زرار المسح -->
      @if (searchControl.value) {
        <button
          type="button"
          (click)="searchControl.setValue('')"
          aria-label="Clear search"
          class="clear-btn absolute end-2 top-1/2 -translate-y-1/2 grid place-items-center w-6 h-6 rounded-full text-gray-400
                 transition-colors duration-200 hover:bg-indigo-50 hover:text-indigo-600">
          <svg class="w-3.5 h-3.5" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" aria-hidden="true">
            <path d="M5 5l10 10M15 5L5 15" />
          </svg>
        </button>
      }
    </div>
  </div>

</aside>
