<nav class="bg-white text-gray-800 h-16 px-4 lg:px-6 shadow-sm relative border-b border-gray-200">

  <div class="flex h-full items-center gap-2">

    <!-- Burger: يفتح السايدبار على الموبايل -->
    <button type="button" (click)="layout.toggleMobile()"
            aria-label="Open sidebar"
            class="md:hidden flex h-10 w-10 items-center justify-center rounded-lg text-gray-700 transition-colors hover:bg-gray-100">
      <i class="fa-solid fa-bars text-xl"></i>
    </button>

    <!-- السلة + الحساب + اللغة -->
    <div class="ms-auto flex items-center gap-1 lg:gap-3">

      <!-- السلة -->
      <a routerLink="/Carts"
         class="flex items-center gap-2 cursor-pointer group px-3 py-2 rounded-lg hover:bg-gray-100 transition-all duration-300">
        <div class="relative flex items-center justify-center">
          <i class="fa-solid fa-cart-shopping text-xl text-gray-600 group-hover:text-indigo-600 transition-colors"></i>
          @if (basket.itemCount() > 0) {
            <span class="absolute -top-2 -end-2 flex h-4 w-4 items-center justify-center rounded-full bg-indigo-600 text-[10px] font-bold text-white shadow-sm">
              {{ basket.itemCount() }}
            </span>
          }
        </div>
      </a>

      <!-- الحساب -->
      <div class="relative">
        <div (click)="toggleAccountMenu()"
             class="flex items-center gap-2 cursor-pointer group px-3 py-2 rounded-lg hover:bg-gray-100 transition-all duration-300">
          <i class="fa-solid fa-circle-user text-xl text-gray-600 group-hover:text-indigo-600 transition-colors"></i>
          <span class="hidden lg:block text-sm font-medium group-hover:text-indigo-600 transition-colors">{{ 'NAV.ACCOUNT' | translate }}</span>
          <i class="fa-solid fa-chevron-down text-xs ms-1 text-gray-600 group-hover:text-indigo-600 transition-all duration-200"
             [class.rotate-180]="isAccountMenuOpen()"></i>
        </div>

        @if (isAccountMenuOpen()) {
          <div class="absolute end-0 mt-2 w-32 bg-[#1f1f1f] rounded-md shadow-xl py-1 z-50 border border-gray-700">

            @if (auth.isLoggedIn()) {
              <a routerLink="/Carts/MyOrders" (click)="isAccountMenuOpen.set(false)"
                 class="flex items-center justify-start gap-2 px-3 py-2 text-xs text-gray-200 hover:bg-gray-700 transition-colors">
                <i class="fa-solid fa-list text-gray-400 text-sm w-4"></i>
                <span>{{ 'NAV.MY_ORDER' | translate }}</span>
              </a>

              <!-- @if (auth.isAdmin()) {
                <a routerLink="/Admin/Orders" (click)="isAccountMenuOpen.set(false)"
                   class="flex items-center justify-start gap-2 px-3 py-2 text-xs text-gray-200 hover:bg-gray-700 transition-colors">
                  <i class="fa-solid fa-list text-gray-400 text-sm w-4"></i>
                  <span>{{ 'ADMIN_ORDERS.TITLE' | translate }}</span>
                </a>
              } -->

              <button type="button" (click)="logout()"
                      class="flex w-full items-center justify-start gap-2 px-3 py-2 text-xs text-gray-200 hover:bg-gray-700 transition-colors">
                <i class="fa-solid fa-arrow-right-from-bracket text-gray-400 text-sm w-4"></i>
                <span>{{ 'NAV.Logout' | translate }}</span>
              </button>
            } @else {
              <a routerLink="/Register" (click)="isAccountMenuOpen.set(false)"
                 class="flex items-center justify-start gap-2 px-3 py-2 text-xs text-gray-200 hover:bg-gray-700 transition-colors">
                <i class="fa-solid fa-user-plus text-gray-400 text-sm w-4"></i>
                <span>{{ 'NAV.REGISTER' | translate }}</span>
              </a>

              <a routerLink="/Login" (click)="isAccountMenuOpen.set(false)"
                 class="flex items-center justify-start gap-2 px-3 py-2 text-xs text-gray-200 hover:bg-gray-700 transition-colors">
                <i class="fa-solid fa-arrow-right-to-bracket text-gray-400 text-sm w-4"></i>
                <span>{{ 'NAV.LOGIN' | translate }}</span>
              </a>
            }

          </div>
        }
      </div>

      <!-- تغيير اللغة -->
      <div class="relative">
        <button (click)="toggleLangMenu()"
                class="flex items-center gap-2 text-sm font-bold uppercase hover:text-indigo-600 px-3 py-1.5 bg-gray-100 rounded transition-colors border border-gray-200">
          {{ langService.currentLang() === 'en' ? 'EN' : 'AR' }}
          <i class="fa-solid fa-chevron-down text-[10px] transition-transform duration-200" [class.rotate-180]="isLangMenuOpen()"></i>
        </button>

        @if (isLangMenuOpen()) {
          <div class="absolute end-0 mt-1 w-16 bg-white border border-gray-200 rounded-md shadow-lg py-1 z-50">
            <button (click)="langService.setLanguage('en'); isLangMenuOpen.set(false)" class="block w-full text-center px-2 py-1.5 text-sm font-semibold text-gray-700 hover:bg-gray-100 hover:text-indigo-600 transition-colors">EN</button>
            <button (click)="langService.setLanguage('ar'); isLangMenuOpen.set(false)" class="block w-full text-center px-2 py-1.5 text-sm font-semibold text-gray-700 hover:bg-gray-100 hover:text-indigo-600 transition-colors">AR</button>
          </div>
        }
      </div>

    </div>
  </div>

</nav>
